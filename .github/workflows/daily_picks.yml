name: Daily Stock Picks

on:
  # Trigger via Cloudflare Worker cron (see cf-worker-trigger/) which calls
  # this workflow's dispatch endpoint at 12:30 UTC Mon-Fri. We removed the
  # native GitHub `schedule:` event on 2026-05-19 because it had drifted to
  # +3.5h late under platform load — CF cron is reliable within ~1 min.
  workflow_dispatch:

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # required to auto-commit weekly/*.json + stats.md back
    steps:
      # 2026-05-26: GitHub's anti-abuse system occasionally returns a transient
      # "remote: Your account is suspended" error on `git fetch` during
      # checkout from CI runner IPs. actions/checkout@v4's built-in retry
      # (3 attempts in ~30s) is too tight to ride out that flag. So: try
      # once, swallow failure, sleep 60s, try again. If both fail, the job
      # fails as before — manual `gh workflow run` retry covers that case.
      - name: Checkout (attempt 1)
        id: checkout1
        uses: actions/checkout@v4
        with:
          set-safe-directory: true
        continue-on-error: true

      - name: Sleep 60s if checkout failed
        if: steps.checkout1.outcome == 'failure'
        run: |
          echo "Checkout attempt 1 failed — likely a transient GH anti-abuse flag."
          echo "Sleeping 60s before retry..."
          sleep 60

      - name: Checkout (attempt 2)
        if: steps.checkout1.outcome == 'failure'
        uses: actions/checkout@v4
        with:
          set-safe-directory: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run picker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: "33"
        run: python main.py

      # Auto-commit the updated weekly tracking JSON back to the repo so the
      # next day's run can read this week's locked entries + accumulated
      # daily_closes. stats.md may also have been appended on Friday close.
      - name: Commit tracking + dashboard updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Add each path conditionally — a single `git add a b` aborts on
          # the first missing pathspec and silently skips the others, even
          # with `|| true` (seen 2026-05-26 when stats.md didn't exist yet).
          [ -d tracking ] && git add tracking/
          [ -d docs ] && git add docs/
          [ -d weekly ] && git add weekly/
          if git diff --staged --quiet; then
            echo "No tracking changes to commit."
          else
            git commit -m "Auto: cohort tracking $(date -u +%Y-%m-%d)"
            # Retry push once on transient failure (same flavor as checkout retry).
            git push || (sleep 30 && git push)
          fi
