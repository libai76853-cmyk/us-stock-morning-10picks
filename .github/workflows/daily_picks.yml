name: Daily Stock Picks

on:
  # Trigger via Cloudflare Worker cron (see cf-worker-trigger/) which calls
  # this workflow's dispatch endpoint at 12:30 UTC Mon-Fri. We removed the
  # native GitHub `schedule:` event on 2026-05-19 because it had drifted to
  # +3.5h late under platform load — CF cron is reliable within ~1 min.
  workflow_dispatch:

jobs:
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run picker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOP_N: "33"
        run: python main.py
